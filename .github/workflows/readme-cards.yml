name: Refresh README cards

on:
  schedule:
    - cron: "0 3 * * *"      # every day, 03:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", "data/ascii.json"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contribution calendar
        run: python scripts/fetch_contributions.py toufeeqahmed916
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render README cards
        run: python scripts/render_readme_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/contributions.json
          git diff --staged --quiet || git commit -m "chore: refresh README cards"
          git push
